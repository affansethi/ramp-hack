name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint, type check and tests
        run: make check

      - name: API and gate tests against Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/api tests/gates

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Never-fail cases live in tests/api and tests/unit as well as tests/gates,
      # so the required gates check runs every test (brief Task 16).
      - name: Release gates, never-fail cases and replay eval
        run: pytest tests

  web:
    # Playwright 1.57 browsers support Ubuntu 24.04, not the 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          pip install -r ../requirements.txt

      - name: Component tests
        run: npm test

      - name: Build and check app/static is current
        run: |
          npm run build
          git diff --exit-code -- ../app/static

      - name: Browser end-to-end (replay, temp-signed rule copies)
        run: |
          npx playwright install --with-deps chromium
          PYTHON=python npx playwright test --reporter=line
