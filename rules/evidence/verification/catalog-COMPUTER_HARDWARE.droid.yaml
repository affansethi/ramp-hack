notes: >-
  Independent answer from the Design Spec section 4.1 candidate set (product basis), Technical
  Spec v2 sections 3 and 4, the app's fact-key vocabulary (app/domain/commands.py
  ALLOWED_FACT_FIELDS, app/domain/pipeline.py), and official NY sources (hardware is scoped to the
  one NY case). Common invoice facts (vendor_name, invoice_date, line_description, line_amount,
  buyer_entity) and tax_charged are required for every category by the Design Spec. Hardware
  requires confirmed delivery evidence instead of the SaaS location ladder, and a sourced shipping
  amount (explicit zero allowed) for the taxable base. Law supports why they matter: NY DTF Use Tax
  for Businesses imposes use tax on property delivered to the business in New York when sales tax
  was not paid, measured on cost including shipping and handling, at the rate where delivery is
  taken (delivery_evidence, shipping, tax_charged); NY TB-ST-838 includes seller shipping or
  delivery charges in the amount subject to use tax (shipping). The SaaS-only keys
  (delivery_method, access_model, service_period, seat_count, user_location) are not required for
  hardware. tax_charged_jurisdiction is required only when tax was charged; app/domain/holds.py
  enforces that after the catalog loop, so it is not in the unconditional list. bill_to is
  informational and never required.
  Comparison (after this file was written): identical to the research pass and to rules/catalog.yaml,
  same 8 keys in the same order; no reordering was needed. Snapshot hashes are SHA-256 of the
  LF bytes as committed (the Design Spec hash is of its git blob, since core.autocrlf rewrites
  line endings in a Windows checkout).
sources:
  - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
    authority: published guidance (NY DTF Tax Bulletin, Use Tax for Businesses)
    pinpoint: Use Tax for Businesses, purchases over the Internet / by common carrier (example)
    quote: "You buy a computer through a retail Web site from a business that does not collect New York sales tax. It is delivered by a freight company to your business in New York State. You owe New York State and local use tax on the cost of the computer, including any charge for shipping and handling."
    supports: [delivery_evidence, shipping, tax_charged]
    retrieved_at: "2026-11-10"
