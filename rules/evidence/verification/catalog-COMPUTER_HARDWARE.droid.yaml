  - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
    authority: published guidance (NY DTF Tax Bulletin, Use Tax for Businesses)
    pinpoint: Use Tax for Businesses, How to calculate use tax
    quote: "Use tax is generally due on the consideration given or contracted to be given for the property or service, or for the use of the property or service, including any charges by the seller to the user for shipping or handling. Generally, the rate of tax used to compute the use tax due is the rate in effect where the business takes delivery of an item or service, or where it uses the item or service, if higher."
    supports: [delivery_evidence, shipping]
