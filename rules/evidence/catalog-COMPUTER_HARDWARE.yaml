        authority: agency_guidance
        pinpoint: Use Tax for Businesses, How to calculate use tax
        quote: |
          Generally, the rate of tax used to compute the use tax due is the rate in effect where the business takes delivery of an item or service, or where it uses the item or service, if higher.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-use-tax-for-businesses.txt
        snapshot_sha256: 3d9bec844b4caba535912c297dc72ce6343adf2489fb63df451c72ed1bd249ac
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
        authority: agency_guidance
        pinpoint: Use Tax for Businesses, Sales and use tax forms, Form ST-130 travel-agency computer example
        quote: |
          The seller has the computer delivered to the travel agency's office in New York. Use tax on the purchase must be paid directly to the Tax Department using the Form ST-130 within 20 days of its delivery to the travel agency.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-use-tax-for-businesses.txt
        snapshot_sha256: 3d9bec844b4caba535912c297dc72ce6343adf2489fb63df451c72ed1bd249ac
  - field: shipping
    value: required
    product_basis: Design Spec 4.1 hardware rule (sourced shipping amount, explicit zero allowed, is part of the signed rule's taxable base; NY-TPP-001 calculation is net_plus_shipping)
    sources:
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
        authority: agency_guidance
        pinpoint: Use Tax for Businesses, How to calculate use tax
        quote: |
          Use tax is generally due on the consideration given or contracted to be given for the property or service, or for the use of the property or service, including any charges by the seller to the user for shipping or handling.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-use-tax-for-businesses.txt
        snapshot_sha256: 3d9bec844b4caba535912c297dc72ce6343adf2489fb63df451c72ed1bd249ac
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
