    sources:
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, subsection (607) Records requirement
        quote: |
          Every taxpayer liable for any tax collected by the department must keep and preserve, for a period of five years, suitable records to determine the amount of tax owed.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
  - field: tax_charged
    value: required
    product_basis: Design Spec 4.1, tax-charged rows (amount including "none shown"; jurisdiction when charged) plus the explicit-zero rule (a sourced zero reaches the engine; a silent invoice holds)
    sources:
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, subsection (e) Reporting
        quote: |
          A buyer claiming an exemption under this rule must report and pay state and local use tax directly to the department.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/use_tax_for_businesses.htm
        authority: agency_guidance
        pinpoint: Use Tax for Businesses, Sales and use tax forms, Form ST-130 travel-agency computer example
        quote: |
          The corporation purchases a computer over the Internet from a seller located outside New York State, who did not collect New York State sales tax from the corporation. The seller has the computer delivered to the travel agency's office in New York. Use tax on the purchase must be paid directly to the Tax Department using the Form ST-130 within 20 days of its delivery to the travel agency.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-use-tax-for-businesses.txt
        snapshot_sha256: 3d9bec844b4caba535912c297dc72ce6343adf2489fb63df451c72ed1bd249ac
  - field: delivery_method
    value: required
    product_basis: Design Spec 4.1, SaaS row (delivery method; an AI assumption that SaaS means no media is not accepted)
    sources:
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Introduction
        quote: |
          Therefore, prewritten computer software is taxable whether sold: on a disk or other physical medium; by electronic transmission; or by remote access.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
        snapshot_sha256: 829a7f8cd1c8739de25106e019f0de8a16c00b5e20c2a2808630812274e6633b
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, Example 6 (remote access prewritten software)
        quote: |
          Company is selling remote access prewritten software subject to retail sales tax and retailing B&O tax.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
  - field: access_model
    value: required
    product_basis: Design Spec 4.1, SaaS row (access model; invoice, order form, or terms span)
    sources:
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Remotely accessed software
        quote: |
          When a purchaser remotely accesses software over the Internet, the seller has transferred possession of the software because the purchaser gains constructive possession of the software and the right to use or control the software.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
        snapshot_sha256: 829a7f8cd1c8739de25106e019f0de8a16c00b5e20c2a2808630812274e6633b
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Remotely accessed software
        quote: |
          Accordingly, the sale to a purchaser in New York of a license to remotely access software is subject to state and local sales tax.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
        snapshot_sha256: 829a7f8cd1c8739de25106e019f0de8a16c00b5e20c2a2808630812274e6633b
      - url: https://www.cdtfa.ca.gov/lawguides/vol1/sutr/1502.html
        authority: regulation
        pinpoint: Regulation 1502, item (7) (time-sharing access by remote telecommunication)
        quote: |
          Charges made for the use of a computer, on a time-sharing basis, where access to the computer is by means of remote telecommunication are not subject to tax.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/cdtfa-reg-1502.txt
        snapshot_sha256: bebf811bd14f9c56d5e12ccad252b0863833ac08d9d6ade2d1410484863cd5c6
  - field: service_period
    value: required
    product_basis: Design Spec 4.1, SaaS row (service period; invoice, order form, or terms span). The signed WA rule timing basis is service_period_start.
    sources:
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, Example 10 (monthly subscription service)
        quote: |
          Thus, the monthly subscription service is not excluded from the definition of digital automated service and is subject to retail sales tax and retailing B&O tax.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
  - field: seat_count
    value: required
    product_basis: Design Spec 4.1, SaaS row (seat count; invoice, order form, or terms span). Multiple points of use apportion by users.
    sources:
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, subsection (c) Apportionment (allocation) of use tax, Example 30
        quote: |
          A business or other organization subject to use tax on digital products or digital codes that are concurrently available for use within and outside this state is entitled to apportion the amount of tax due this state based on users in this state compared to users everywhere.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Remotely accessed software
        quote: |
          the seller of the software should collect tax based on the portion of the receipt attributable to the users located in New York.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
        snapshot_sha256: 829a7f8cd1c8739de25106e019f0de8a16c00b5e20c2a2808630812274e6633b
  - field: user_location
    value: required
    product_basis: Design Spec 4.1, user-location row (user location by state covering all seats; confirmed SaaS ladder). Partial or conflicting coverage holds.
    sources:
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, subsection (c)(ii), definition of User
        quote: |
          "User" means an employee or agent of the taxpayer who is authorized by the taxpayer to use the digital product purchased in the performance of his or her duties as an employee or other agent of the taxpayer.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
      - url: https://app.leg.wa.gov/WAC/default.aspx?cite=458-20-15503
        authority: regulation
        pinpoint: WAC 458-20-15503, subsection (c)(i) Records requirement
        quote: |
          No allocation under this rule is allowed unless the allocation method is supported by the taxpayer's records kept in the ordinary course of business in compliance with the records requirement in subsection (607) of this rule for tax liabilities owed to this state.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Remotely accessed software (situs rule)
        quote: |
          The situs of the sale for purposes of determining the proper local tax rate and jurisdiction is the location from which the purchaser uses or directs the use of the software, not the location of the code embodying the software.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
        snapshot_sha256: 829a7f8cd1c8739de25106e019f0de8a16c00b5e20c2a2808630812274e6633b
