        retrieved_at: "2026-11-10"
        snapshot: snapshots/wac-458-20-15503.txt
        snapshot_sha256: 1dab5a4599db112f349ceb8ddce394b65051b20a2527409da1119195ebf850dc
  - field: line_description
    value: required
    product_basis: Design Spec 4.1, invoice row (line description; accepted source is an invoice or spend-record span)
    sources:
      - url: https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/st/computer_software.htm
        authority: agency_guidance
        pinpoint: TB-ST-128 (Computer Software), Computer software services
        quote: |
          the charge for the service is exempt from tax only when the charge for the service is reasonable and separately stated on the invoice or billing statement given to the customer.
        retrieved_at: "2026-11-10"
        snapshot: snapshots/ny-tb-st-128-computer-software.txt
