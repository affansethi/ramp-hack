[project]
name = "tax-leak"
version = "0.1.0"
description = "Tax Leak (RAMP) — purchase-side sales/use tax review. Hackathon demo, synthetic data only."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
strict = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
